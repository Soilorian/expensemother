name: CI and deployment

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: expense
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: expensemother_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U expense -d expensemother_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://expense:ci-only-password@localhost:5432/expensemother_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"
      - run: go mod download && go mod verify
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: Verify concurrent database operations repeatedly
        run: go test -race -count=5 ./internal/adapters/postgres
      - name: Check deployment scripts
        run: |
          bash -n scripts/deploy.sh scripts/ci-compose-smoke.sh
          shellcheck scripts/deploy.sh scripts/ci-compose-smoke.sh

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set image name
        id: name
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "image=ghcr.io/${REPOSITORY,,}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Build backend and Telegram image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: ${{ steps.name.outputs.image }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test the production Compose stack
        env:
          APP_IMAGE: ${{ steps.name.outputs.image }}
        run: bash scripts/ci-compose-smoke.sh
      - name: Sign in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image
        id: publish
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          APP_IMAGE: ${{ steps.name.outputs.image }}
        run: |
          docker push "$APP_IMAGE"
          digest=$(docker image inspect "$APP_IMAGE" --format '{{index .RepoDigests 0}}')
          echo "image=$digest" >> "$GITHUB_OUTPUT"
          echo "Published backend + Telegram image: \`$digest\`" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: image
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    environment: production
    concurrency:
      group: expensemother-production
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/expensemother' }}
      APP_IMAGE: ${{ needs.image.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          [[ "$DEPLOY_PATH" =~ ^/[a-zA-Z0-9_/-]+$ && "$DEPLOY_PATH" != / ]]
          [[ "$APP_IMAGE" =~ ^ghcr.io/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$ ]]
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Deploy backend, Telegram bot and PostgreSQL
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          incoming="/tmp/expensemother-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          opts=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15)
          ssh "${opts[@]}" -p "$DEPLOY_PORT" "$remote" "umask 077; mkdir '$incoming'"
          scp "${opts[@]}" -P "$DEPLOY_PORT" scripts/deploy.sh compose.production.yaml "$remote:$incoming/"
          printf '%s\n' "$REGISTRY_TOKEN" |
            ssh "${opts[@]}" -p "$DEPLOY_PORT" "$remote" "read -r REGISTRY_TOKEN; export REGISTRY_TOKEN; bash '$incoming/deploy.sh' '$DEPLOY_PATH' '$APP_IMAGE' '$incoming/compose.production.yaml' '$GITHUB_REPOSITORY_OWNER'"
          echo "Deployed \`$APP_IMAGE\`" >> "$GITHUB_STEP_SUMMARY"
